name: Diagnose Deluge daemon startup

on:
  push:
    branches:
      - feature/libtorrent-2.1-webtorrent
  workflow_dispatch:

jobs:
  daemon-startup:
    name: daemon-startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      UV_SYSTEM_PYTHON: 1
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set fork development package version
        shell: bash
        run: echo 2.2.0.dev0 > RELEASE-VERSION
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        shell: bash
        run: |
          uv pip install -r requirements-ci.txt
          uv pip install -e .
          python -c 'import libtorrent as lt; print("libtorrent:", lt.__version__)'
      - name: Windows crypto and Twisted setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install openssl.light --version=1.1.1.20181020
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          cd "$SITE_PACKAGES"
          patch -p1 < "$GITHUB_WORKSPACE/.github/patches/twisted-glib-windows.patch"
      - name: Reproduce first daemon/client fixture with early failure diagnostics
        shell: bash
        run: |
          python -m pytest -s -vv -x --tb=short deluge/tests/test_client.py::TestClient::test_connect_no_credentials
      - name: Inspect any saved daemon startup logs
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in list(Path('_pytest_temp').rglob('daemon.log'))[:10]:
              print(f'===== {file} =====')
              print(file.read_text(errors='replace')[-14000:])
          PY
