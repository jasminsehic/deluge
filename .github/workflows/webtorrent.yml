name: WebTorrent / libtorrent 2.1

on:
  pull_request:
  workflow_dispatch:

jobs:
  rtc-and-wss:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Deluge
        uses: actions/checkout@v4
        with:
          path: deluge
          fetch-depth: 0

      - name: Set fork development package version
        run: echo 2.2.0.dev0 > deluge/RELEASE-VERSION

      - name: Check out WebTorrent-enabled libtorrent and submodules
        uses: actions/checkout@v4
        with:
          repository: jasminsehic/libtorrent
          ref: 0bc49658f973321a515f73bee9b104688f3e481b
          submodules: recursive
          path: libtorrent-src

      - name: Install build tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libssl-dev ccache \
            libboost-python1.83-dev libboost-system1.83-dev libboost-json1.83-dev \
            python3-dev python3-venv
          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install -r deluge/requirements-ci.txt 'websockets==13.1'
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip uninstall -y libtorrent
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --no-deps -e ./deluge

      - name: Restore compiled libtorrent build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: libtorrent-build
          key: rtc-lt-0bc49658-ubuntu2404-boost183-abi3-v1

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: rtc-ccache-linux-boost183-0bc49658-v1

      - name: Configure libtorrent 2.1 with WebTorrent
        run: |
          cmake -S libtorrent-src -B libtorrent-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-DBOOST_JSON_HEADER_ONLY \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=OFF \
            -Dfpic=ON \
            -Dwebtorrent=ON \
            -Dpython-bindings=ON \
            -Dbuild_tests=ON \
            -Ddeprecated-functions=OFF \
            -DPython3_EXECUTABLE=$GITHUB_WORKSPACE/.venv/bin/python

      - name: Build native Python bindings and RTC transfer executable
        run: cmake --build libtorrent-build --parallel 2 --target python-libtorrent test_webtorrent_transfer

      - name: Cache compiled libtorrent build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libtorrent-build
          key: rtc-lt-0bc49658-ubuntu2404-boost183-abi3-v1

      - name: Verify RTC peer piece and metadata transfers
        run: ctest --test-dir libtorrent-build --output-on-failure -R '^test_webtorrent_transfer$'

      - name: Verify Deluge WSS tracker announces contain RTC offers
        working-directory: deluge
        env:
          PYTHONPATH: ${{ github.workspace }}/libtorrent-build/bindings/python
        run: |
          $GITHUB_WORKSPACE/.venv/bin/python -c 'import libtorrent as lt; print(lt.__version__); assert tuple(map(int, lt.__version__.split(".")[:2])) >= (2, 1); assert "webtorrent_stun_server" in lt.session().get_settings()'
          $GITHUB_WORKSPACE/.venv/bin/python -m pytest -v deluge/tests/test_webtorrent.py -m webtorrent

      - name: Check Deluge regression tests with native libtorrent
        working-directory: deluge
        env:
          PYTHONPATH: ${{ github.workspace }}/libtorrent-build/bindings/python
        run: $GITHUB_WORKSPACE/.venv/bin/python -m pytest -v -m 'not (todo or gtkui or internet)' deluge/tests/test_common.py deluge/tests/test_torrent.py deluge/tests/test_torrentmanager.py deluge/tests/test_session_settings_compat.py
